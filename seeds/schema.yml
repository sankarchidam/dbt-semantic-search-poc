    config:
      column_types:
        customer_id: integer
  - name: raw_orders
    config:
      column_types:
        order_id: integer
        customer_id: integer
        order_date: date
  - name: raw_order_items
    config:
      column_types:
        order_item_id: integer
        order_id: integer
