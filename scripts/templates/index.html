<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lakehouse Semantic Search</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a;
    --text: #e6e8ee; --muted: #8b93a7; --accent: #5b8cff;
    --metric: #5b8cff; --dimension: #35c98f; --table: #d4a24c; --ai: #c792ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); padding: 2rem 1.5rem 4rem;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 1.5rem; }
  .search-box {
    display: flex; gap: 0.5rem; margin-bottom: 0.5rem;
  }
  input[type="text"] {
    flex: 1; padding: 0.75rem 1rem; font-size: 1rem; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); }
  .ai-toggle {
    display: flex; align-items: center; gap: 0.4rem; margin-bottom: 1rem;
    font-size: 0.82rem; color: var(--muted); user-select: none;
  }
  .ai-toggle input { accent-color: var(--ai); }
  .ai-toggle label { cursor: pointer; }
  .ai-toggle.disabled { opacity: 0.5; }
  .ai-toggle.disabled label { cursor: not-allowed; }
  .ai-hint { font-size: 0.74rem; color: var(--muted); }
  .examples { color: var(--muted); font-size: 0.8rem; margin-bottom: 1.5rem; }
  .examples button {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.78rem; cursor: pointer;
    margin: 0.15rem 0.25rem 0.15rem 0;
  }
  .examples button:hover { border-color: var(--accent); color: var(--text); }
  .status { color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; min-height: 1.2em; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 1rem 1.1rem; margin-bottom: 0.75rem;
  }
  .card.ai-card { border-color: rgba(199,146,234,0.4); }
  .card-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
  .badge {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; padding: 0.15rem 0.5rem;
    border-radius: 5px; text-transform: uppercase;
  }
  .badge.metric { background: rgba(91,140,255,0.15); color: var(--metric); }
  .badge.dimension { background: rgba(53,201,143,0.15); color: var(--dimension); }
  .badge.model { background: rgba(212,162,76,0.15); color: var(--table); }
  .badge.ai { background: rgba(199,146,234,0.15); color: var(--ai); }
  .badge.heuristic { background: rgba(139,147,167,0.15); color: var(--muted); }
  .card-name { font-weight: 600; font-size: 1.02rem; }
  .score { color: var(--muted); font-size: 0.78rem; margin-left: auto; }
  .card-desc { color: var(--muted); font-size: 0.88rem; margin: 0.4rem 0 0; line-height: 1.4; }
  .time-range, .filter-line {
    font-size: 0.82rem; color: var(--ai); margin-top: 0.5rem;
    font-family: ui-monospace, monospace;
  }
  .chips { margin-top: 0.7rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
  .chip {
    font-size: 0.78rem; padding: 0.25rem 0.6rem; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer;
  }
  .chip.selected { border-color: var(--accent); color: var(--text); background: rgba(91,140,255,0.12); }
  .run-btn {
    margin-top: 0.8rem; background: var(--accent); color: white; border: none;
    padding: 0.5rem 1rem; border-radius: 7px; font-size: 0.85rem; cursor: pointer; font-weight: 600;
  }
  .run-btn:hover { filter: brightness(1.1); }
  .cmd { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted);
    margin-top: 0.5rem; word-break: break-all; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.9rem; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; }
  .err { color: #ff6b6b; font-size: 0.85rem; margin-top: 0.6rem; }
  .plain-list { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔎 Lakehouse Semantic Search</h1>
  <p class="subtitle">Search this mini dbt-defined lakehouse's metrics, dimensions, and tables in plain English.</p>

  <div class="search-box">
    <input type="text" id="q" placeholder="e.g. how many items sold last month" autofocus>
  </div>
  <div class="ai-toggle {{ '' if llm_available else 'disabled' }}">
    <input type="checkbox" id="useAi" {{ '' if llm_available else 'disabled' }}>
    <label for="useAi">🤖 Ask AI (resolves real dates like "last month", not just a heuristic)</label>
    {% if not llm_available %}<span class="ai-hint">— set OPENAI_API_KEY on the server to enable</span>{% endif %}
  </div>
  <div class="examples">
    Try:
    <button data-q="monthly revenue by region">monthly revenue by region</button>
    <button data-q="revenue by product category">revenue by product category</button>
    <button data-q="how was my shampoo sales last month">how was my shampoo sales last month</button>
    <button data-q="revenue from cancelled orders">revenue from cancelled orders</button>
  </div>
  <div class="status" id="status"></div>
  <div id="results"></div>
</div>

<script>
const q = document.getElementById("q");
const useAi = document.getElementById("useAi");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
let debounceTimer = null;

document.querySelectorAll(".examples button").forEach(btn => {
  btn.addEventListener("click", () => { q.value = btn.dataset.q; runSearch(); });
});

q.addEventListener("input", () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(runSearch, 300);
});
q.addEventListener("keydown", (e) => {
  if (e.key === "Enter") { clearTimeout(debounceTimer); runSearch(); }
});

async function runSearch() {
  const query = q.value.trim();
  if (!query) { resultsEl.innerHTML = ""; statusEl.textContent = ""; return; }

  if (useAi.checked && !useAi.disabled) {
    statusEl.textContent = "Asking AI to interpret the query...";
    resultsEl.innerHTML = "";
    const res = await fetch(`/api/interpret?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    if (data.mode === "none") {
      statusEl.textContent = data.message;
      return;
    }
    statusEl.textContent = data.mode === "llm" ? "Interpreted by AI" : "AI unavailable — used keyword fallback";
    resultsEl.appendChild(renderInterpretCard(data));
    return;
  }

  statusEl.textContent = "Searching...";
  const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
  const items = await res.json();
  statusEl.textContent = `${items.length} matches`;
  resultsEl.innerHTML = "";
  items.forEach(item => resultsEl.appendChild(renderCard(item, query)));
}

function renderCard(item, query) {
  const card = document.createElement("div");
  card.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `
    <span class="badge ${item.type}">${item.type}</span>
    <span class="card-name">${item.name}</span>
    <span class="score">similarity ${item.score}</span>
  `;
  card.appendChild(head);

  const desc = document.createElement("p");
  desc.className = "card-desc";
  desc.textContent = item.description;
  card.appendChild(desc);

  if (item.type === "metric") {
    buildRunnableMetric(card, item.name, item.available_dimensions, item.group_by || [], null, null, []);
  } else if (item.type === "model") {
    const list = document.createElement("div");
    list.className = "plain-list";
    list.textContent = "Columns: " + item.columns.join(", ");
    card.appendChild(list);
  }

  return card;
}

function renderInterpretCard(data) {
  const card = document.createElement("div");
  card.className = "card ai-card";

  const head = document.createElement("div");
  head.className = "card-head";
  head.innerHTML = `
    <span class="badge ${data.mode === 'llm' ? 'ai' : 'heuristic'}">${data.mode === 'llm' ? '🤖 AI' : 'heuristic'}</span>
    <span class="card-name">${data.metric}</span>
  `;
  card.appendChild(head);

  const desc = document.createElement("p");
  desc.className = "card-desc";
  desc.textContent = data.description;
  card.appendChild(desc);

  if (data.start_date || data.end_date) {
    const range = document.createElement("div");
    range.className = "time-range";
    range.textContent = `📅 ${data.start_date || "…"} → ${data.end_date || "…"}`;
    card.appendChild(range);
  }

  (data.filters || []).forEach(f => {
    const line = document.createElement("div");
    line.className = "filter-line";
    line.textContent = `🔎 ${f.dimension} ILIKE '${f.value}'`;
    card.appendChild(line);
  });

  buildRunnableMetric(card, data.metric, data.available_dimensions, data.group_by || [], data.start_date, data.end_date, data.filters || []);
  return card;
}

// Shared by both the plain search cards and the AI-interpreted card: dimension
// chips (pre-selected, still toggleable), a Run button, and a result table.
// `filters` (dimension/value pairs from LLM interpretation, if any) are
// applied as-is -- there's no UI to edit them here, only to run or not.
function buildRunnableMetric(card, metricName, availableDims, preselected, startDate, endDate, filters) {
  const selected = new Set(preselected);
  const chipRow = document.createElement("div");
  chipRow.className = "chips";
  const dims = availableDims.map(d => d === "metric_time" ? "metric_time__month" : d);
  dims.forEach(dim => {
    const chip = document.createElement("button");
    chip.className = "chip" + (selected.has(dim) ? " selected" : "");
    chip.textContent = dim.replace("__", " › ");
    chip.dataset.dim = dim;
    chip.addEventListener("click", () => chip.classList.toggle("selected"));
    chipRow.appendChild(chip);
  });
  card.appendChild(chipRow);

  const runBtn = document.createElement("button");
  runBtn.className = "run-btn";
  runBtn.textContent = "Run query";
  const cmdEl = document.createElement("div");
  cmdEl.className = "cmd";
  const outputEl = document.createElement("div");

  runBtn.addEventListener("click", async () => {
    const groupBy = [...chipRow.querySelectorAll(".chip.selected")].map(c => c.dataset.dim);
    runBtn.textContent = "Running...";
    outputEl.innerHTML = "";
    const params = new URLSearchParams({ metric: metricName, group_by: groupBy.join(",") });
    if (startDate) params.set("start_date", startDate);
    if (endDate) params.set("end_date", endDate);
    if (filters && filters.length) params.set("filters", JSON.stringify(filters));
    const res = await fetch(`/api/query?${params.toString()}`);
    const data = await res.json();
    runBtn.textContent = "Run query";
    if (data.error) {
      outputEl.innerHTML = `<div class="err">${escapeHtml(data.error)}</div>`;
      return;
    }
    cmdEl.textContent = data.command;
    outputEl.appendChild(renderTable(data.columns, data.rows));
  });

  card.appendChild(runBtn);
  card.appendChild(cmdEl);
  card.appendChild(outputEl);
}

function renderTable(columns, rows) {
  const table = document.createElement("table");
  const thead = document.createElement("thead");
  thead.innerHTML = "<tr>" + columns.map(c => `<th>${escapeHtml(c)}</th>`).join("") + "</tr>";
  table.appendChild(thead);
  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = row.map(v => `<td>${escapeHtml(v)}</td>`).join("");
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
