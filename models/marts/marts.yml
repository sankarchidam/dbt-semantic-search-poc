version: 2

models:
  - name: metricflow_time_spine
    description: "Daily date spine required by MetricFlow for time-based metric calculations."
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

  - name: dim_customers
    description: "One row per customer, with region and segment attributes."
    columns:
      - name: customer_id
        description: "Primary key for a customer."
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "One row per product, with its category."
    columns:
      - name: product_id
        description: "Primary key for a product."
        tests:
          - unique
          - not_null

  - name: fct_orders
    description: "One row per order (order grain), with the order's total amount, item quantity, status, and date. Product detail is not available at this grain -- use fct_order_items for product/category breakdowns."
    columns:
      - name: order_id
        description: "Primary key for an order."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_customers."
      - name: order_amount
        description: "Total dollar amount of the order (sum of line item amounts)."
      - name: item_quantity
        description: "Total number of units across all line items in the order."

  - name: fct_order_items
    description: "One row per order line item (line-item grain), with product, quantity, and dollar amount. Use this for revenue/quantity broken down by product or category."
    columns:
      - name: order_item_id
        description: "Primary key for an order line item."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_orders."
      - name: product_id
        description: "Foreign key to dim_products."
      - name: line_amount
        description: "Dollar amount of this line item (quantity * unit_price)."

  - name: fct_payments
    description: "One row per payment attempt (order grain), conformed from five processor feeds (Square, Stripe, PayPal, e-check, Venmo) into one status vocabulary (completed/failed/pending). An order can have more than one row -- a failed attempt followed by a successful retry, often on a different channel."
    columns:
      - name: payment_id
        description: "Primary key for a payment attempt. Not globally sequential -- each channel has its own id scheme (e.g. sq_000001, ch_000001, PP-000001)."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_orders. Not unique -- an order can have multiple payment attempts."
      - name: channel
        description: "Which processor this attempt ran through: square, stripe, paypal, echeck, or venmo."
      - name: amount
        description: "Dollar amount attempted, normalized to a common unit (Square/Stripe report cents natively; this is already converted)."
      - name: status
        description: "Conformed status: completed, failed, or pending -- mapped from each channel's own vocabulary (e.g. Square's COMPLETED, PayPal's Completed, e-check's Cleared all become 'completed')."
