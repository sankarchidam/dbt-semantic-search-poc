version: 2

metrics:
  - name: revenue
    description: "Total revenue: sum of order dollar amounts."
    type: simple
    label: "Revenue"
    type_params:
      measure: order_total

  - name: order_count
    description: "Number of orders placed."
    type: simple
    label: "Order Count"
    type_params:
      measure: order_count

  - name: average_order_value
    description: "Average dollar amount per order (revenue divided by order count)."
    type: ratio
    label: "Average Order Value"
    type_params:
      numerator: revenue
      denominator: order_count

  - name: total_items_sold
    description: "Total quantity of items sold across all orders (order grain -- cannot be broken down by product or category; use items_sold for that)."
    type: simple
    label: "Total Items Sold"
    type_params:
      measure: item_quantity

  - name: product_revenue
    description: "Revenue from order line items, broken down by product or category (line-item grain -- use this instead of revenue when slicing by product)."
    type: simple
    label: "Product Revenue"
    type_params:
      measure: line_revenue

  - name: items_sold
    description: "Quantity of items sold, broken down by product or category (line-item grain -- use this instead of total_items_sold when slicing by product)."
    type: simple
    label: "Items Sold"
    type_params:
      measure: line_item_quantity

  - name: payments_collected
    description: "Total dollar amount successfully collected across all payment channels (status = completed only). Sliceable by channel, or -- via the order entity -- by customer region/segment or order status."
    type: simple
    label: "Payments Collected"
    type_params:
      measure: payment_amount
    filter: |
      {{ Dimension('payment__status') }} = 'completed'

  - name: payment_attempts
    description: "Count of all payment attempts across all channels, regardless of outcome. Includes retries -- an order with a failed attempt followed by a successful one counts as two attempts here."
    type: simple
    label: "Payment Attempts"
    type_params:
      measure: payment_attempt_count

  - name: failed_payments
    description: "Count of payment attempts that failed (declined, denied, returned) -- use to spot processor or channel issues, e.g. broken down by channel."
    type: simple
    label: "Failed Payments"
    type_params:
      measure: payment_attempt_count
    filter: |
      {{ Dimension('payment__status') }} = 'failed'
